<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>餐餐吃什麼 - 118巷美食輪盤</title>

    <!-- 引入 Bootstrap 5 框架 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 引入 Google Fonts (與原網站規範保持一致) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Serif+TC:wght@300;500;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Qwitcher+Grypen:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="bg-decorations"></div>

    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container d-flex justify-content-center">
            <a class="navbar-brand m-0" href="#">Food Roulette</a>
        </div>
    </nav>

    <main class="container flex-grow-1 py-4">

        <div class="title-ornament mt-3">
            <h2 class="fs-2 fw-bold m-0" style="color: var(--text-vintage);">餐餐吃什麼</h2>
        </div>
        <p class="text-center text-muted mb-4 eng-vintage" style="font-family: 'Noto Serif TC', serif;">
            不知道國北 118 巷要吃什麼？讓命運的輪盤幫你決定！
        </p>

        <!-- 輪盤區塊 -->
        <div class="text-center mb-4">
            <div style="position: relative; display: inline-block;">
                <!-- 靜態指針 -->
                <div class="pointer"></div>
                <!-- 靜態蕾絲裝飾外框 -->
                <div class="wheel-wrapper">
                    <!-- 內部旋轉的 Canvas -->
                    <canvas id="wheelCanvas"></canvas>
                </div>
            </div>

            <div class="mt-4 d-flex justify-content-center gap-3">
                <button onclick="startSpin()" id="spinBtn" class="btn-custom fs-5">
                    🍽️ 開始旋轉！
                </button>
            </div>
        </div>

        <!-- 抽籤結果區塊 (預設隱藏) -->
        <div id="resultArea" class="mx-auto" style="display: none; max-width: 420px; animation: fadeInRomantic 0.8s ease;">
            <div class="card">
                <div class="card-inner text-center">
                    <h5 class="eng-vintage text-muted mb-1 fs-6">Today's Choice</h5>
                    <h3 id="resultName" class="fw-bold mb-4" style="color: var(--pink-ribbon); letter-spacing: 1px;">-</h3>

                    <div class="reflection-box text-start mb-4">
                        <strong>💡 命運的安排：</strong><br>
                        看來這頓飯就是要吃這家了！點擊下方按鈕直接開啟 Google Maps 查看確切位置與評論，準備出發吧！
                    </div>

                    <a id="mapLink" href="#" target="_blank" class="btn-custom d-inline-block text-decoration-none" style="padding: 10px 24px;">
                        📍 前往 Google Maps 導航
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer class="mt-auto py-4 text-center" style="border-top: 1px solid var(--pearl-border); background-color: rgba(255,255,255,0.5);">
        <p class="eng-vintage mb-0" style="color: #887; font-size: 0.95rem;">© 2026 EnChi Jan / Food Roulette Design</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
